<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalun Ho</title>
<meta name="description" content="Kalun Ho — personal site. Under construction.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Georgia,serif'>K</text></svg>">
<style>
  :root {
    --bg: #faf9f7;
    --bg-glow: #ffffff;
    --ink: #16150f;
    --muted: #6f6b60;
    --rule: #d8d4c8;
    --accent: #a8763e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --bg-glow: #1a1a1f;
      --ink: #f2efe9;
      --muted: #8d8879;
      --rule: #2c2b30;
      --accent: #c99a5b;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    background-image: radial-gradient(ellipse 90% 70% at 50% 0%, var(--bg-glow), transparent 70%);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    text-align: center;
    max-width: 34rem;
    animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.75rem, 12vw, 5.5rem);
    letter-spacing: 0.02em;
    line-height: 1.05;
  }

  .rule {
    width: 3.5rem;
    height: 1px;
    margin: 2rem auto 1.75rem;
    border: 0;
    background: var(--rule);
    position: relative;
    overflow: hidden; /* clip the glint to the rule's own width */
  }

  /* A slow glint travelling the rule — the only motion on the page. */
  .rule::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 5s ease-in-out infinite;
  }

  .status {
    margin: 0;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-indent: 0.28em; /* balance the trailing letterspace */
  }

  .note {
    margin: 1.25rem 0 0;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--muted);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.75rem); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes sweep {
    0%, 100% { opacity: 0; transform: translateX(-100%); }
    50%      { opacity: 1; transform: translateX(100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .rule::after { animation: none; opacity: .5; transform: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>Kalun&nbsp;Ho</h1>
    <hr class="rule">
    <p class="status">Under construction</p>
    <p class="note">Something is being built here. Check back soon.</p>
  </main>
</body>
</html>
