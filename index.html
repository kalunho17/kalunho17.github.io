<html lang="en-GB">

<!-- THEME START: same on every page. Light by default; applies a stored "dark" or "system" choice before the first paint (toggle: /assets/js/site.js) -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var root = document.documentElement, theme = null;
    root.classList.add('js');
    try { theme = localStorage.getItem('theme'); } catch (error) {}
    if (theme !== 'dark' && theme !== 'system') return;
    root.setAttribute('data-theme', theme);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
      meta.content = theme === 'dark' || /dark/.test(meta.media) ? '#10365C' : '#FFFFFF';
    });
  }());
</script>
<!-- THEME END -->
